<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>🌐 AI Language Translator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Fast, accurate AI-powered multi-language translator with speech recognition and voice synthesis.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --success: #10b981;
      --danger: #ef4444;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --radius: 16px;
    }

    body.dark {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: #1e1b4b;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .app-container {
      width: 100%;
      max-width: 820px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 32px;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 28px;
      color: var(--primary);
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .theme-toggle-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      padding: 8px 14px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      transform: translateY(-1px);
    }

    /* Language bar controls */
    .lang-toolbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    select {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 500;
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .swap-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--border);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.25s ease;
    }

    .swap-btn:hover {
      background: var(--primary);
      color: #ffffff;
      transform: rotate(180deg);
    }

    /* Translation Cards Area */
    .cards-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-box,
    .output-box {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card-bg);
      padding: 16px;
      position: relative;
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    textarea {
      width: 100%;
      min-height: 120px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .box-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .icon-btn.recording {
      background: #fee2e2;
      color: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }

    .char-count {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Translate action button */
    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0;
      gap: 12px;
    }

    .shortcut-hint {
      font-size: 13px;
      color: var(--text-muted);
    }

    .shortcut-hint kbd {
      background: var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    .translate-btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      transition: all 0.2s ease;
    }

    .translate-btn:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
    }

    .translate-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Output Box */
    .output-box {
      background: var(--primary-light);
      border-color: rgba(79, 70, 229, 0.2);
      min-height: 140px;
    }

    .output-text {
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 60px;
    }

    .output-placeholder {
      color: var(--text-muted);
      font-style: italic;
    }

    .detected-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(79, 70, 229, 0.15);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    /* Audio player */
    .audio-wrapper {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    audio {
      width: 100%;
      height: 38px;
      border-radius: 8px;
    }

    /* Error Banner */
    .error-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    body.dark .error-banner {
      background: #450a0a;
      border-color: #7f1d1d;
      color: #fca5a5;
    }

    /* Footer info */
    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
    }

    @media (max-width: 640px) {
      .app-container {
        padding: 20px 16px;
      }

      .lang-toolbar {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .swap-btn {
        margin: 0 auto;
        transform: rotate(90deg);
      }

      .swap-btn:hover {
        transform: rotate(270deg);
      }

      .action-row {
        flex-direction: column-reverse;
        align-items: stretch;
      }

      .translate-btn {
        width: 100%;
        justify-content: center;
      }

      .shortcut-hint {
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">

    <!-- Language Selector Toolbar -->

      <button type="button" class="swap-btn" onclick="swapLanguages()" title="Swap Languages"
        aria-label="Swap Languages">
        <i class="fa-solid fa-right-left"></i>

        <option value="es">🇪🇸 Spanish</option>
        <option value="fr">🇫🇷 French</option>
        <option value="de">🇩🇪 German</option>
        <option value="zh-CN">🇨🇳 Chinese (Simplified)</option>
        <option value="ja">🇯🇵 Japanese</option>
        <option value="ko">🇰🇷 Korean</option>
        <option value="ar">🇸🇦 Arabic</option>
        <option value="ru">🇷🇺 Russian</option>
        <option value="pt">🇵🇹 Portuguese</option>
        <option value="it">🇮🇹 Italian</option>
        <option value="mr">🇮🇳 Marathi</option>
        <option value="bn">🇧🇩 Bengali</option>
        <option value="gu">🇮🇳 Gujarati</option>
        <option value="ta">🇮🇳 Tamil</option>
        <option value="te">🇮🇳 Telugu</option>
        <option value="kn">🇮🇳 Kannada</option>

        <option value="tr">🇹🇷 Turkish</option>

        <option value="pl">🇵🇱 Polish</option>
        <option value="uk">🇺🇦 Ukrainian</option>
        <option value="vi">🇻🇳 Vietnamese</option>
        <option value="th">🇹🇭 Thai</option>
        <option value="id">🇮🇩 Indonesian</option>
        <option value="el">🇬🇷 Greek</option>
        <option value="sv">🇸🇪 Swedish</option>
        <option value="cs">🇨🇿 Czech</option>
        <option value="ro">🇷🇴 Romanian</option>
        <option value="he">🇮🇱 Hebrew</option>

    </div>

    <!-- Cards Area -->
    <div class="cards-grid">
      <!-- Input Card -->
      <div class="input-box">
        <textarea id="textInput" placeholder="Enter text or click Speak..." maxlength="5000"
          oninput="updateCharCount()"></textarea>
        <div class="box-footer">
          <div class="btn-group">
            <button type="button" class="icon-btn" id="micBtn" onclick="toggleSpeech()" title="Speech to text">
              <i class="fa-solid fa-microphone"></i>
              <span id="micText">Speak</span>
            </button>
            <button type="button" class="icon-btn" onclick="speakText('input')" title="Listen to input text">
              <i class="fa-solid fa-volume-high"></i>
            </button>
            <button type="button" class="icon-btn" onclick="clearInput()" title="Clear text">

            </button>

          <span class="char-count" id="charCount">0 / 5000</span>
        </div>

      <!-- Action Row -->
      <div class="action-row">
        <div class="shortcut-hint">
          Tip: Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to translate
        </div>

          <!-- <i class="fa-solid fa-wand-magic-sparkles"></i> -->
          <span id="btnText">Translate</span>
        </button>

          <span id="detectedText">Detected: English</span>
        </div>

        <div class="output-text" id="translatedText">
          <span class="output-placeholder">Translation will appear here...</span>
        </div>

        <div class="audio-wrapper" id="audioContainer" style="display: none;">
          <audio id="audioPlayer" controls>
            <source id="audioSource" src="" type="audio/mpeg">
            Your browser does not support audio playback.
          </audio>
        </div>

        <div class="box-footer" id="outputFooter" style="display: none;">
          <div class="btn-group">
            <button type="button" class="icon-btn" id="copyBtn" onclick="copyTranslation()" title="Copy to clipboard">
              <i class="fa-regular fa-copy"></i>
              <span id="copyText">Copy</span>
            </button>
            <button type="button" class="icon-btn" onclick="speakText('output')" title="Listen to translation">

      <p>Language Translator • Powered by Flask & Google Translate</p>

  <script>
    let speechRecognition = null;
    let isRecording = false;
    let lastDetectedLang = 'en';

    // Initialize Theme
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark');
        updateThemeUI(true);
      } else {
        document.body.classList.remove('dark');
        updateThemeUI(false);
      }
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeUI(isDark);
    }

    function updateThemeUI(isDark) {
      const themeIcon = document.getElementById('themeIcon');
      const themeText = document.getElementById('themeText');
      if (isDark) {
        themeIcon.className = 'fa-solid fa-sun';
        themeText.textContent = 'Light';
      } else {
        themeIcon.className = 'fa-solid fa-moon';
        themeText.textContent = 'Dark';
      }
    }

    initTheme();

    // Character Counter
    function updateCharCount() {
      const text = document.getElementById('textInput').value;
      document.getElementById('charCount').textContent = `${text.length} / 5000`;
    }

    function clearInput() {
      document.getElementById('textInput').value = '';
      updateCharCount();
      hideError();
    }

    // Language Swapping
    function swapLanguages() {
      const sourceSelect = document.getElementById('sourceLang');
      const targetSelect = document.getElementById('targetLang');
      const textInput = document.getElementById('textInput');
      const translatedElem = document.getElementById('translatedText');

      let currentSource = sourceSelect.value;
      let currentTarget = targetSelect.value;

      if (currentSource === 'auto') {
        currentSource = lastDetectedLang || 'en';
      }

      // Swap selector values
      sourceSelect.value = currentTarget;
      targetSelect.value = currentSource;

      // Swap text if translation exists
      const currentTranslatedText = translatedElem.innerText.trim();
      if (currentTranslatedText && !translatedElem.querySelector('.output-placeholder')) {
        textInput.value = currentTranslatedText;
        updateCharCount();
        translateText();
      }
    }

    // Error Banner Helpers
    function showError(msg) {
      const banner = document.getElementById('errorBanner');
      const msgElem = document.getElementById('errorMessage');
      msgElem.textContent = msg;
      banner.style.display = 'flex';
    }

    function hideError() {
      document.getElementById('errorBanner').style.display = 'none';
    }

    // Main Translate Function
    function translateText() {
      const textInput = document.getElementById('textInput');
      const text = textInput.value.trim();
      const sourceLang = document.getElementById('sourceLang').value;
      const targetLang = document.getElementById('targetLang').value;
      const translateBtn = document.getElementById('translateBtn');
      const btnText = document.getElementById('btnText');
      const outputElem = document.getElementById('translatedText');
      const outputFooter = document.getElementById('outputFooter');
      const audioContainer = document.getElementById('audioContainer');
      const audioPlayer = document.getElementById('audioPlayer');
      const detectedBadge = document.getElementById('detectedBadge');
      const detectedText = document.getElementById('detectedText');

      hideError();

      if (!text) {
        showError('Please enter some text to translate.');
        textInput.focus();
        return;
      }

      // Loading state
      translateBtn.disabled = true;
      btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Translating...';

      fetch('/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: text,
          source_lang: sourceLang,
          target_lang: targetLang
        })
      })
        .then(async (res) => {
          const data = await res.json();
          if (!res.ok || data.error) {
            throw new Error(data.error || 'Failed to translate.');
          }
          return data;
        })
        .then((data) => {
          // Display translation
          outputElem.textContent = data.translated_text;
          outputFooter.style.display = 'flex';

          // Update detected language
          if (sourceLang === 'auto' && data.detected_lang) {
            lastDetectedLang = data.detected_lang;
            detectedText.textContent = `Detected language: ${data.detected_lang.toUpperCase()}`;
            detectedBadge.style.display = 'inline-flex';
          } else {
            detectedBadge.style.display = 'none';
          }

          // Handle Audio
          if (data.audio_url) {
            const audioSrc = document.getElementById('audioSource');
            audioSrc.src = data.audio_url.startsWith('data:')
              ? data.audio_url
              : data.audio_url + '?t=' + Date.now();
            audioPlayer.load();
            audioContainer.style.display = 'flex';
          } else {
            audioContainer.style.display = 'none';
          }
        })
        .catch((err) => {
          showError(err.message || 'Translation failed. Please try again.');
        })
        .finally(() => {
          translateBtn.disabled = false;
          btnText.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Translate';
        });
    }

    // Copy Translation to Clipboard
    function copyTranslation() {
      const translatedElem = document.getElementById('translatedText');
      const textToCopy = translatedElem.innerText.trim();
      const copyBtn = document.getElementById('copyBtn');
      const copyText = document.getElementById('copyText');

      if (!textToCopy || translatedElem.querySelector('.output-placeholder')) return;

      navigator.clipboard.writeText(textToCopy).then(() => {
        copyText.textContent = 'Copied!';
        copyBtn.style.color = 'var(--success)';
        setTimeout(() => {
          copyText.textContent = 'Copy';
          copyBtn.style.color = '';
        }, 2000);
      }).catch(() => {
        showError('Unable to copy to clipboard.');
      });
    }

    // Speech to Text (Web Speech API)
    function toggleSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showError('Speech recognition is not supported in this browser. Please use Google Chrome, Edge, or Safari.');
        return;
      }

      const micBtn = document.getElementById('micBtn');
      const micText = document.getElementById('micText');
      const sourceLang = document.getElementById('sourceLang').value;

      if (isRecording) {
        if (speechRecognition) speechRecognition.stop();
        return;
      }

      speechRecognition = new SpeechRecognition();
      speechRecognition.continuous = false;
      speechRecognition.interimResults = true;

      // Map language code to BCP-47 locale
      const localeMap = {
        'en': 'en-US', 'hi': 'hi-IN', 'es': 'es-ES', 'fr': 'fr-FR', 'de': 'de-DE',
        'zh-CN': 'zh-CN', 'ja': 'ja-JP', 'ko': 'ko-KR', 'ar': 'ar-SA', 'ru': 'ru-RU',
        'pt': 'pt-BR', 'it': 'it-IT', 'mr': 'mr-IN', 'bn': 'bn-IN', 'gu': 'gu-IN',
        'ta': 'ta-IN', 'te': 'te-IN', 'kn': 'kn-IN', 'ml': 'ml-IN', 'pa': 'pa-IN',
        'ur': 'ur-PK', 'tr': 'tr-TR', 'nl': 'nl-NL', 'pl': 'pl-PL', 'uk': 'uk-UA',
        'vi': 'vi-VN', 'th': 'th-TH', 'id': 'id-ID'
      };

      speechRecognition.lang = (sourceLang !== 'auto' && localeMap[sourceLang])
        ? localeMap[sourceLang]
        : (navigator.language || 'en-US');

      speechRecognition.onstart = function () {
        isRecording = true;
        micBtn.classList.add('recording');
        micText.textContent = 'Listening...';
        hideError();
      };

      speechRecognition.onresult = function (event) {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          transcript += event.results[i][0].transcript;
        }
        document.getElementById('textInput').value = transcript;
        updateCharCount();
      };

      speechRecognition.onerror = function (event) {
        console.error('Speech recognition error:', event.error);
        if (event.error !== 'no-speech') {
          showError('Microphone error: ' + event.error);
        }
        stopRecordingUI();
      };

      speechRecognition.onend = function () {
        stopRecordingUI();
      };

      try {
        speechRecognition.start();
      } catch (e) {
        console.error(e);
        stopRecordingUI();
      }
    }

    function stopRecordingUI() {
      isRecording = false;
      const micBtn = document.getElementById('micBtn');
      const micText = document.getElementById('micText');
      if (micBtn) micBtn.classList.remove('recording');
      if (micText) micText.textContent = 'Speak';
    }

    // Text to Speech playback (Browser fallback/synthesis)
    function speakText(target) {
      if (!('speechSynthesis' in window)) {
        showError('Speech synthesis is not supported in this browser.');
        return;
      }

      window.speechSynthesis.cancel(); // Stop any active speech

      let text = '';
      let lang = 'en';

      if (target === 'input') {
        text = document.getElementById('textInput').value.trim();
        const src = document.getElementById('sourceLang').value;
        lang = src === 'auto' ? lastDetectedLang : src;
      } else {
        text = document.getElementById('translatedText').innerText.trim();
        lang = document.getElementById('targetLang').value;
      }

      if (!text || text === 'Translation will appear here...') return;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      window.speechSynthesis.speak(utterance);
    }

    // Keyboard shortcut: Ctrl + Enter / Cmd + Enter
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        translateText();
      }
    });
  </script>
</body>

</html>
